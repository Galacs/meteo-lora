; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = ststm32
board = genericSTM32L431CCT6
framework = arduino
monitor_speed = 115200
lib_deps = 
	symlink://../common
	sparkfun/SparkFun Weather Meter Kit Arduino Library@^1.1.2
	enjoyneering/HTU21D@^1.2.1
	jgromes/RadioLib@^7.7.1
	adafruit/Adafruit SHT31 Library@^2.2.2
	schm1tz1/MS5xxx@^1.1.2
extra_scripts = pre:add_swo_viewer.py
; swo_trace_clkin_freq = 80000000
debug_server = $PLATFORMIO_CORE_DIR/packages/tool-openocd/bin/openocd
	-f $PLATFORMIO_CORE_DIR/packages/tool-openocd/scripts/interface/stlink.cfg
	-f $PLATFORMIO_CORE_DIR/packages/tool-openocd/scripts/target/stm32l4x.cfg
	-c "stm32l4x.tpiu configure -protocol uart"
	-c "stm32l4x.tpiu configure -output -"
	-c "stm32l4x.tpiu configure -traceclk 80000000"
	-c "stm32l4x.tpiu configure -pin-freq 2000000"
	-c "stm32l4x.tpiu configure -formatter 0"
	-c "itm ports on"
	-c "stm32l4x.tpiu enable"
	-c "tcl_port 6666"
