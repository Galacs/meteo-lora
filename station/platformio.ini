; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = ststm32
board = genericSTM32L431CCT6
framework = arduino
monitor_speed = 115200
lib_deps = 
	symlink://../common
	sparkfun/SparkFun MPL3115A2 Altitude and Pressure Sensor Breakout@^1.2.4
	sparkfun/SparkFun Weather Meter Kit Arduino Library@^1.1.2
	mbed-yamaguch/MS5607@0.0.0+sha.5760862143d1
	enjoyneering/HTU21D@^1.2.1
