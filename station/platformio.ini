; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = ststm32
board = genericSTM32L431CCT6
framework = arduino
monitor_speed = 115200
lib_deps = 
	https://www.airspayce.com/mikem/arduino/RadioHead/RadioHead-1.145.zip
	symlink://../common
	adafruit/Adafruit Si7021 Library@^1.5.3
	sparkfun/SparkFun MPL3115A2 Altitude and Pressure Sensor Breakout@^1.2.4
	sparkfun/SparkFun Weather Meter Kit Arduino Library@^1.1.2
